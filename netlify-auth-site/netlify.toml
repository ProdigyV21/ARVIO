[build]
  command = "npm --prefix ../web ci --include=dev && node scripts/build-partner-pilot.mjs --site"
  publish = "public-build"

[build.environment]
  NODE_VERSION = "22"

[functions."retention-cleanup"]
  schedule = "@daily"

[functions."trial-email-worker"]
  schedule = "*/30 * * * *"

[functions."discord-premium-reconcile"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/delete"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/account-deletion"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account/*"
  to = "/delete-account.html"
  status = 200
