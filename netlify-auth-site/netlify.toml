[build]
  # The partner pilot build reads ../web, so web changes still rebuild this site.
  # Exit 0 = skip. Deploy previews are never built (owner request, Nov 2026), and
  # production skips commits that leave this site's sources unchanged.
  ignore = 'if [ "$CONTEXT" = "deploy-preview" ]; then exit 0; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../web'
  command = "npm --prefix ../web ci --include=dev && node scripts/build-partner-pilot.mjs --site"
  publish = "public-build"

[build.environment]
  NODE_VERSION = "22"

[functions."retention-cleanup"]
  schedule = "@daily"

[functions."trial-email-worker"]
  schedule = "*/30 * * * *"

[functions."discord-premium-reconcile"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/delete"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/account-deletion"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

[[redirects]]
  from = "/delete-account/*"
  to = "/delete-account.html"
  status = 200
