name: Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "app/src/main/res/**/strings.xml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web.arvio.tv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_WEB_SITE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web regression tests
        # Run the same complete test set without competing test processes.
        run: node --test --test-concurrency=1 tests/*.test.cjs

      - name: Install payment backend dependencies
        working-directory: netlify-auth-site
        run: npm ci

      - name: Run payment backend regression tests
        working-directory: netlify-auth-site
        run: npm test

      # CLI builds do not reliably inherit the site's browser build variables.
      # Export only these public client values, never the OAuth client secret.
      - name: Load required public build configuration
        shell: bash
        env:
          PUBLIC_TRAKT_ID: ${{ secrets.WEB_PUBLIC_TRAKT_CLIENT_ID }}
          PUBLIC_APP_KEY: ${{ secrets.WEB_PUBLIC_APP_ANON_KEY }}
        run: |
          trakt_id="$PUBLIC_TRAKT_ID"
          app_key="$PUBLIC_APP_KEY"
          if [[ ${#trakt_id} -lt 10 || ${#app_key} -lt 40 || "$trakt_id" == *'*'* || "$app_key" == *'*'* ]]; then
            echo "Missing required public Trakt/cloud configuration; refusing to publish a stale-only client." >&2
            exit 1
          fi
          echo "::add-mask::$trakt_id"
          echo "::add-mask::$app_key"
          {
            printf 'NEXT_PUBLIC_TRAKT_CLIENT_ID=%s\n' "$trakt_id"
            printf 'NEXT_PUBLIC_ARVIO_APP_ANON_KEY=%s\n' "$app_key"
            printf 'ARVIO_BUILD_APP_ANON_KEY=%s\n' "$app_key"
            echo 'ARVIO_VERIFY_BUILD_CONFIG=true'
          } >> "$GITHUB_ENV"

      - name: Build Netlify bundle
        env:
          NEXT_PUBLIC_MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          NEXT_PUBLIC_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          NEXT_PUBLIC_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: npx --yes netlify-cli@25.6.0 build --context production

      - name: Record expected build stamp
        shell: bash
        run: |
          expected_stamp=$(jq -er '.config.env.NEXT_PUBLIC_BUILD_STAMP' .next/required-server-files.json)
          route_stamp=$(jq -er '.v' .next/server/app/version.json.body)
          if [[ ! "$expected_stamp" =~ ^[0-9]{10,16}$ || "$route_stamp" != "$expected_stamp" ]]; then
            echo "Client and version manifest disagree; refusing to publish an update loop." >&2
            exit 1
          fi
          echo "EXPECTED_BUILD_STAMP=$expected_stamp" >> "$GITHUB_ENV"

      # The compatible backend must accept the new diagnostics before the web
      # client is published. Keep this after all tests and web build guards.
      - name: Deploy payment backend to production
        working-directory: netlify-auth-site
        env:
          NETLIFY_SITE_ID: 17ccb668-bf3c-412d-9573-a28a09e52122
        run: >-
          npx --yes netlify-cli@25.6.0 deploy
          --prod
          --no-build
          --dir .
          --functions netlify/functions
          --site 17ccb668-bf3c-412d-9573-a28a09e52122
          --message "Payment backend GitHub ${GITHUB_SHA}"
          --timeout 900

      # Deploy the generated function source so Netlify preserves its /* route.
      - name: Deploy to production
        run: >-
          npx --yes netlify-cli@25.6.0 deploy
          --prod
          --no-build
          --dir .netlify/static
          --functions .netlify/functions-internal
          --message "GitHub ${GITHUB_SHA}"
          --timeout 900

      - name: Verify production deployment
        shell: bash
        run: |
          for attempt in {1..20}; do
            status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" https://web.arvio.tv/ || true)
            live_stamp=$(curl --silent --show-error --fail https://web.arvio.tv/version.json | jq -r .v 2>/dev/null || true)
            if [[ "$status" == "200" && "$live_stamp" == "$EXPECTED_BUILD_STAMP" ]]; then
              echo "Production deployment verified: $live_stamp"
              exit 0
            fi
            echo "Waiting for production: HTTP $status, stamp ${live_stamp:-missing} (attempt $attempt/20)"
            sleep 6
          done

          echo "Production did not serve the expected build stamp $EXPECTED_BUILD_STAMP" >&2
          exit 1
