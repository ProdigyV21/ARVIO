name: Cloudstream hosting availability (read only)
on:
  workflow_dispatch:
  push:
    branches: [codex/cloudstream-web-direct]
    paths: [".github/workflows/cloudstream-hosting-check.yml"]
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read existing Cloudflare account capabilities
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node <<'JS'
          const token = process.env.CF_TOKEN, account = process.env.CF_ACCOUNT;
          if (!token || !account) { console.log('Existing Cloudflare deployment credentials are not configured.'); process.exit(0); }
          (async () => {
            for (const endpoint of ['workers/account-settings', 'containers/applications', 'subscriptions']) {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${endpoint}`, {
                headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(20000)
              });
              const payload = await response.json();
              const summary = { endpoint, status: response.status, success: payload.success };
              if (endpoint === 'workers/account-settings' && payload.success) summary.usageModel = payload.result?.default_usage_model;
              if (endpoint === 'subscriptions' && payload.success) summary.plans = (payload.result || []).map(x => x.rate_plan?.id).filter(Boolean);
              console.log(JSON.stringify(summary));
            }
          })().catch(() => { console.error('Read-only capability check failed.'); process.exitCode = 1; });
          JS
