[build]
  command = "echo Static site ready"
  publish = "."

[[plugins]]
  package = "./plugins/indexnow"

[[redirects]]
  from = "/privacy"
  to = "https://github.com/ProdigyV21/ARVIO/blob/main/PRIVACY.md"
  status = 302
  force = true

[[redirects]]
  from = "/app"
  to = "https://web.arvio.tv"
  status = 302
  force = true

[[redirects]]
  from = "/app/*"
  to = "https://web.arvio.tv/:splat"
  status = 302
  force = true

[[redirects]]
